services:
    hq:
        build: .
        volumes:
            - ./src:/hq
            - ./testdata:/testdata
            - go-mod-cache:/go/pkg/mod
            - go-build-cache:/root/.cache/go-build
        working_dir: /hq
        stdin_open: true
        tty: true

volumes:
    go-mod-cache:
    go-build-cache:
